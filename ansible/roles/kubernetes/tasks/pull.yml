---
# k3s 通过 air-gap 镜像包预置镜像：随 k3s 启动自动导入，避免运行期拉取
- name: Ensure the k3s agent images directory exists
  become: true
  file:
    path: "{{ k3s_data_dir }}/agent/images"
    state: directory
    mode: "0755"
  when:
    - inventory_hostname in groups['kubernetes']

- name: Download the k3s air-gap images
  become: true
  get_url:
    url: "{{ k3s_airgap_url }}"
    dest: "{{ k3s_data_dir }}/agent/images/k3s-airgap-images-{{ k3s_arch }}.tar"
    mode: "0644"
    timeout: "{{ k3s_download_timeout }}"
  when:
    - inventory_hostname in groups['kubernetes']
