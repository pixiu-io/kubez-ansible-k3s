---
# 使用 globals.yml 中手工维护的 apiserver 地址与 token 扩容工作节点
# k3s 不需要 ca-cert-hash，该变量保留仅为兼容旧配置（可选）
- name: Validate add-node configuration
  assert:
    that:
      - kube_apiserver_address | string | length > 0
      - kube_admin_token | string | length > 0
    fail_msg: >-
      add-node requires kube_apiserver_address (format: VIP:6443 or IP:6443) and
      kube_admin_token in globals.yml. kube_admin_token_ca_cert_hash is not used by k3s.
  run_once: True

- name: Prepare OS for the k3s agents
  include_tasks: os-prep.yml
  vars:
    os_prep_scope: kube-node

- name: Set the k3s join parameters from globals.yml
  set_fact:
    k3s_token: "{{ kube_admin_token }}"
    k3s_join_address: "{{ kube_apiserver_address | regex_replace('^https?://', '') | regex_replace('/+$', '') }}"
  changed_when: false
  connection: local
  run_once: True

- name: Deploy k3s agents
  include_tasks: k3s-agent.yml
