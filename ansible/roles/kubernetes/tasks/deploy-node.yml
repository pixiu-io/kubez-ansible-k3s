---
- include_tasks: pull.yml
  when:
    - inventory_hostname in groups['kube-node']

- name: Prepare OS for the k3s agents
  include_tasks: os-prep.yml
  vars:
    os_prep_scope: kube-node

- name: Read the k3s cluster token from the first server
  become: true
  command: "cat {{ k3s_data_dir }}/server/node-token"
  register: k3s_token_result
  changed_when: false
  delegate_to: "{{ groups['kube-master'][0] }}"
  run_once: True

- name: Set the k3s join parameters
  set_fact:
    k3s_token: "{{ k3s_token_result.stdout | trim }}"
    k3s_join_address: >-
      {{ kube_vip_address if (enable_haproxy | bool and kube_vip_address | string | length > 0)
         else first_master_address }}
  changed_when: false
  connection: local
  run_once: True

- name: Deploy k3s agents
  include_tasks: k3s-agent.yml

- name: Remove taints from control plane nodes
  include_tasks: taint.yml
