---
- name: Prepare OS for the k3s cluster
  include_tasks: os-prep.yml
  vars:
    os_prep_scope: kubernetes

# k3s 的 join 地址：启用 haproxy 时走 VIP，否则直连第一个 master
- name: Set the k3s join address
  set_fact:
    k3s_join_address: >-
      {{ kube_vip_address if (enable_haproxy | bool and kube_vip_address | string | length > 0)
         else first_master_address }}
  changed_when: false
  connection: local
  run_once: True

- name: Deploy k3s control plane
  include_tasks: k3s-server.yml

- name: Deploy k3s agents
  include_tasks: k3s-agent.yml

- name: Remove taints from control plane nodes
  include_tasks: taint.yml

- name: Prepare kubeconfig for k3s cluster
  block:
    - name: Ensure .kube folder exist
      file:
        path: ~/.kube
        state: directory
        mode: "0700"

    - name: Copy k3s.yaml into ~/.kube/config
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: ~/.kube/config
        remote_src: yes
        mode: "0600"

    - name: Point kubeconfig to the local apiserver address
      replace:
        path: ~/.kube/config
        regexp: 'https://127\.0\.0\.1:6443'
        replace: "https://{{ api_interface_address }}:6443"
  when: inventory_hostname in groups['kube-master']
