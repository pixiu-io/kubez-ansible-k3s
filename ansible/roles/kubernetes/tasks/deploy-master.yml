---
# 仅安装并启动控制面节点
- include_tasks: precheck.yml

- include_tasks: pull.yml
  when:
    - inventory_hostname in groups['kube-master']

- name: Prepare OS for the k3s control plane
  include_tasks: os-prep.yml
  vars:
    os_prep_scope: kube-master

- name: Set the k3s join address
  set_fact:
    k3s_join_address: >-
      {{ kube_vip_address if (enable_haproxy | bool and kube_vip_address | string | length > 0)
         else first_master_address }}
  changed_when: false
  connection: local
  run_once: True

- name: Deploy k3s control plane
  include_tasks: k3s-server.yml

# 初始化命令行配置文件
- name: Prepare kubeconfig for k3s cluster
  block:
    - name: Ensure .kube folder exist
      file:
        path: ~/.kube
        state: directory
        mode: "0700"

    - name: Copy k3s.yaml into ~/.kube/config
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: ~/.kube/config
        remote_src: yes
        mode: "0600"

    - name: Point kubeconfig to the local apiserver address
      replace:
        path: ~/.kube/config
        regexp: 'https://127\.0\.0\.1:6443'
        replace: "https://{{ api_interface_address }}:6443"
  when: inventory_hostname in groups['kube-master']
