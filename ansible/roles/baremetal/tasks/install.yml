---
- name: Install dependent packages for kubernetes nodes
  package:
    name: "{{ item }}"
    state: present
  loop:
    - "{{ common_dependent_packages }}"
  when:
    - inventory_hostname in groups['kubernetes']

- name: Install haproxy and keepalived
  package:
    name:
      - haproxy
      - keepalived
    state: present
  when:
    - enable_haproxy | bool
    - inventory_hostname in groups['haproxy']

# k3s 为单二进制发行版，自带 containerd / kubectl / kubelet，
# 不再安装 kubelet/kubeadm/containerd 包，也不再渲染 /etc/containerd/config.toml
- name: Check the installed k3s version
  become: true
  command: /usr/local/bin/k3s --version
  register: k3s_installed_version
  changed_when: false
  failed_when: false
  when:
    - inventory_hostname in groups['kubernetes']

- name: Install the k3s binary
  become: true
  get_url:
    url: "{{ k3s_binary_url }}"
    dest: /usr/local/bin/k3s
    mode: "0755"
    timeout: "{{ k3s_download_timeout }}"
  when:
    - inventory_hostname in groups['kubernetes']
    - k3s_installed_version.rc | default(1) != 0 or k3s_version not in (k3s_installed_version.stdout | default(''))

- name: Create k3s command symlinks
  become: true
  file:
    src: /usr/local/bin/k3s
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: yes
  loop:
    - kubectl
    - crictl
    - ctr
  when:
    - inventory_hostname in groups['kubernetes']

- name: Ensure the k3s configuration directory exists
  become: true
  file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"
  when:
    - inventory_hostname in groups['kubernetes']
