---
########################
# Kubez-ansible Options
########################
network_interface: "eth0"
api_interface: "{{ network_interface }}"
api_interface_address: "{{ hostvars[inventory_hostname]['ansible_' + api_interface]['ipv4']['address'] }}"
# 第一个 master 的 API 地址（k3s 加入集群的默认 server 地址）
# 直接从目标主机的 facts 计算，避免 hostvars 取值被当前主机上下文模板化
first_master_address: "{{ hostvars[groups['kube-master'][0]]['ansible_' + hostvars[groups['kube-master'][0]]['api_interface']]['ipv4']['address'] }}"

# kubernetes 镜像仓库地址，默认阿里云，用户可根据实际情况配置
image_repository: "registry.cn-hangzhou.aliyuncs.com/google_containers"

# 自定义镜像仓库
app_image_repository: "ccr.ccs.tencentyun.com/pixiucloud"

# 自定义 REPO 仓库
repo_dir: "/etc/kubez/repo"

# pixiu helm chart 仓库地址
default_repo_name: "pixiuhub"
default_repo_url: "https://registry-1.pixiuio.com/pixiu"

###############
# Repo Options
###############
# 是否启用自定义源
enable_custom_repo: "no"
custom_repo_config: "/etc/kubez/pixiu"

###############
# Host Options
###############
# 自动重置节点的 hostname
# Rocky 系统不生效
set_hostname: "yes"

# 需停止并禁用的防火墙服务（按发行版列出）——兜底值，globals.yml 同名键优先
firewall_services_to_disabled:
  Rocky:
    - firewalld
  AlmaLinux:
    - firewalld
  openEuler:
    - firewalld
  Ubuntu:
    - ufw
  Debian:
    - ufw
  Kylin Linux Advanced Server:
    - firewalld

# 需下发 NetworkManager CNI 豁免配置的发行版——兜底值，globals.yml 同名键优先
networkmanager_conf_distributions:
  - Rocky
  - AlmaLinux
  - openEuler
  - Kylin Linux Advanced Server

#####################
# keepalived options
#####################
# Arbitrary unique number from 0..255
keepalived_virtual_router_id: "68"

#####################
# Kubernetes Options
#####################
kube_application_dir: "/tmp/pixiuspace"
kubez_namespace: pixiu-system

# This should be a VIP, an unused IP on your network that will float between
# the hosts running keepalived for high-availability.
kube_vip_address: ""

# Listen port for kubernetes.
# 启用 haproxy + keepalived 时, 监听端口推荐使用 8443
kube_vip_port: 6443

cluster_cidr: "172.30.0.0/16"
service_cidr: "10.254.0.0/16"

# kube-proxy mode: iptables 或 ipvs，默认 iptables
kube_proxy_mode: "iptables"

# Kubernetes network cni options
# Supported: flannel | calico | cilium
cni: "calico"

# Kubernetes csi options
enable_pixiu_localstorage: "no"

enable_kubernetes: "yes"
enable_kubernetes_ha: "no"
enable_haproxy: "no"
enable_metrics_server: "yes"

kube_release: 1.36.2
kubernetes_version: "v{{ kube_release }}"

########################
# K3s Options
########################
# 集群由 k3s 承载：kube_release 映射为 k3s 版本（如 1.36.2 -> v1.36.2+k3s1），
# 也可在 globals.yml 直接覆盖 k3s_version
k3s_version: "v{{ kube_release }}+k3s1"
# 二进制架构自动识别（x86_64 -> amd64, aarch64 -> arm64）
k3s_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
# k3s 下载源：github（严格对应版本）| cn（rancher 国内镜像站）
k3s_download_source: "github"
k3s_download_timeout: 600
k3s_github_base_url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}"
k3s_cn_base_url: "https://rancher-mirror.rancher.cn/k3s"
k3s_binary_url: "{{ (k3s_github_base_url if k3s_download_source == 'github' else k3s_cn_base_url) }}/k3s{{ '' if k3s_arch == 'amd64' else '-' ~ k3s_arch }}"
k3s_airgap_url: "{{ (k3s_github_base_url if k3s_download_source == 'github' else k3s_cn_base_url) }}/k3s-airgap-images-{{ k3s_arch }}.tar"
# k3s 数据目录
k3s_data_dir: "/var/lib/rancher/k3s"
# 禁用的 k3s 内置组件：CNI / metrics-server / local-storage 等由 kubez-ansible apply 阶段统一安装
k3s_disable_components:
  - traefik
  - servicelb
  - metrics-server
  - local-storage
# CoreDNS 集群 DNS 地址，默认取 service_cidr 的第 4 位为 10（如 10.254.0.0/16 -> 10.254.0.10）
cluster_dns: "{{ service_cidr.split('.')[0:3] | join('.') }}.10"

########################
# Add node options
########################
# These values are maintained by the user and are used by add-node only.
kube_apiserver_address: ""
kube_admin_token: ""
kube_admin_token_ca_cert_hash: ""

# 仓库版本拆分, 以 1.24 为分界版本
release_bump: "{{ kube_base_version | float >= 1.24 }}"
# kubernetes 版本的前两个版本号, 对应阿里云仓库路径
kube_base_version: "{{ kube_release.split('.')[0] }}.{{ kube_release.split('.')[1] }}"

kube_release_ubuntu: "{{ kube_release ~ '-*' }}"

# kube / runtime 包名按包管理器族区分，避免按发行版名枚举
# k3s 模式下不再通过包管理器安装 kubelet/kubeadm，以下变量保留仅为兼容旧 globals.yml
kube_packages_apt:
  - "kubelet={{ kube_release_ubuntu }}"
  - "kubectl={{ kube_release_ubuntu }}"
  - "kubeadm={{ kube_release_ubuntu }}"
kube_packages_rpm:
  - "kubelet-{{ kube_release }}"
  - "kubectl-{{ kube_release }}"
  - "kubeadm-{{ kube_release }}"

##################
# Runtime Options
##################
# 集群运行时为 k3s 内嵌 containerd，以下 runtime/containerd 包变量保留仅为兼容旧 globals.yml，实际不再使用
# runtime containerd version
containerd_release: ""
# runtime data-root-dir
runtime_data_dir: ""
# containerd data-root-dir
containerd_data_dir: "{{ runtime_data_dir }}"

containerd_package_rpm: "containerd.io{{'' if containerd_release == '' else '-' ~ containerd_release }}"
# Debian/非 Ubuntu 的 apt 系使用 containerd.io；Ubuntu 仍用 containerd
containerd_package_apt: "containerd.io{{'' if containerd_release == '' else '=' ~ containerd_release }}"

# 兼容旧变量名（若外部 globals 仍引用）
containerd_package_rocky: "{{ containerd_package_rpm }}"
containerd_package_ubuntu: "containerd{{'' if containerd_release == '' else '=' ~ containerd_release }}"
containerd_package_debian: "{{ containerd_package_apt }}"
containerd_package_openEuler: "{{ containerd_package_rpm }}"

node_config_directory: "/etc/kubez/"

######################
# Certificate Options
######################
# kubeadm certificate validity options (Kubernetes 1.31+)
enable_certificate_period: "no"
certificate_validity_period: ""
ca_certificate_validity_period: ""

# kubernetes node-role
control_labels:
  - node-role.kubernetes.io/master
  - node-role.kubernetes.io/control-plane

kube_repo: "{{ registry_repo if enable_registry | bool else image_repository }}"

kube_applications:
  # pixiu-system should exists before the other applications created
  - name: pixiu-system
    enabled: "yes"
  - name: kube-flannel
    enabled: "{{ cni == 'flannel' }}"
  - name: kube-calico
    enabled: "{{ cni == 'calico' }}"
  - name: kube-cilium
    enabled: "{{ cni == 'cilium' }}"
  - name: metrics-server
    enabled: "{{ enable_metrics_server | bool }}"
  - name: pixiu-autoscaler
    enabled: "{{ enable_pixiu_autoscaler | bool }}"
    # TODO: 临时解决方案，最终可通过调用 preStart 的 webhook 解决
  - name: helm
    enabled: "{{ enable_helm | bool }}"
  - name: pixiu-localstorage
    enabled: "{{ enable_pixiu_localstorage | bool }}"
  - name: metrics-scraper
    enabled: "{{ enable_metrics_scraper | bool }}"

###############
# Helm Options
###############
enable_helm: "yes"

# v3.5.2 and v3.9.0 is available, default is v3.9.0
helm_release: v3.9.0
helm_image: "ccr.ccs.tencentyun.com/pixiucloud/helm-toolbox:{{ helm_release }}"

########################
# Elasticsearch Options
########################
# The Fluentd, elasticsearch, and kibana will be installed when enabled.
enable_elasticsearch: "no"
elasticsearch_name: elasticsearch
elasticsearch_namespace: "{{ kubez_namespace }}"
elasticsearch_chart_version: 8.5.1

elasticsearch_replicas: 1 # 生产环境推荐 3 副本
minimum_master_nodes: 1 # 生产环境至少为 2 节点

###################
# Filebeat Options
###################
enable_filebeat: "no"
filebeat_name: filebeat
filebeat_namespace: "{{ kubez_namespace }}"
filebeat_chart_version: 8.5.1

#################
# Kibana Options
#################
enable_kibana: "no"
kibana_name: kibana
kibana_namespace: "{{ kubez_namespace }}"
kibana_chart_version: 8.5.1

kibana_replicas: 1

##################
# Fluentd Options
##################
enable_fluentd: "no"
fluentd_name: fluentd
fluentd_namespace: "{{ kubez_namespace }}"
fluentd_chart_version: 0.3.9

###########################
# pixiu-autoscaler Options
###########################
enable_pixiu_autoscaler: "yes"

#########################
# metrics-scraper Options
#########################
enable_metrics_scraper: "yes"

##########################
# Helm Chart Applications
##########################
enable_charts:
  - name: elasticsearch
    enabled: "{{ enable_elasticsearch | bool }}"
  - name: kibana
    enabled: "{{ enable_kibana | bool }}"
  - name: filebeat
    enabled: "{{ enable_filebeat | bool }}"
  - name: fluentd
    enabled: "{{ enable_fluentd | bool }}"

charts:
  elasticsearch:
    name: "{{ elasticsearch_name }}"
    namespace: "{{ elasticsearch_namespace }}"
    repository:
      name: elastic
      url: https://helm.elastic.co
    chart:
      path: elastic/elasticsearch
      version: "{{ elasticsearch_chart_version }}"
    chart_extra_vars:
      replicas: "{{ elasticsearch_replicas }}"
      minimumMasterNodes: "{{ minimum_master_nodes }}"
      persistence.enabled: "false" # 暂时关闭，后续启用 storageclass
  kibana:
    name: "{{ kibana_name }}"
    namespace: "{{ kibana_namespace }}"
    repository:
      name: elastic
      url: https://helm.elastic.co
    chart:
      path: elastic/kibana
      version: "{{ kibana_chart_version }}"
    chart_extra_vars:
      replicas: "{{ kibana_replicas }}"
  filebeat:
    name: "{{ filebeat_name }}"
    namespace: "{{ filebeat_namespace }}"
    repository:
      name: elastic
      url: https://helm.elastic.co
    chart:
      path: elastic/filebeat
      version: "{{ filebeat_chart_version }}"
    chart_extra_vars: {}
  fluentd:
    name: "{{ fluentd_name }}"
    namespace: "{{ fluentd_namespace }}"
    repository:
      name: fluent
      url: https://fluent.github.io/helm-charts
    chart:
      path: fluent/fluentd
      version: "{{ fluentd_chart_version }}"
    chart_extra_vars: {}
